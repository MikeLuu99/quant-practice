name: Verify Quant Practice
on:
  pull_request:
  workflow_call:
    inputs:
      mode:
        type: string
        default: staging
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install Worker build tools
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Test Go engines and durable restoration
        run: go test ./... -count=1
        working-directory: backend
      - name: Test frontend and types
        run: bun test && bun run typecheck
        working-directory: frontend
      - name: Test Worker routing
        run: npm run test:worker
      - name: Build Go Wasm and static assets
        run: npm run "build:$QUANT_MODE"
        env:
          QUANT_MODE: ${{ inputs.mode || 'staging' }}
      - name: Exercise actual Go Wasm and SQLite recovery
        run: npm run test:wasm
      - name: Save deployable Cloudflare Build Output
        uses: actions/upload-artifact@v7
        with:
          name: quant-practice-${{ inputs.mode || 'staging' }}
          path: .cloudflare/output/v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
