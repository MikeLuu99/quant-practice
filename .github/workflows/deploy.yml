name: Deploy Quant Practice
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        description: Target Cloudflare environment
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      mode: ${{ inputs.environment || 'staging' }}
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - uses: actions/download-artifact@v8
        with:
          name: quant-practice-${{ inputs.environment || 'staging' }}
          path: .cloudflare/output/v1/
      - name: Deploy the already-verified build
        run: npm run "deploy:$QUANT_MODE"
        env:
          QUANT_MODE: ${{ inputs.environment || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the deployed application
        run: node scripts/smoke-deployment.mjs
        env:
          QUANT_BASE_URL: ${{ vars.QUANT_BASE_URL }}
          QUANT_EXPECTED_REVISION: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Build the Pages frontend bundle
        run: npm run "build:pages:$QUANT_MODE"
        env:
          QUANT_MODE: ${{ inputs.environment || 'staging' }}
          QUANT_API_ORIGIN: ${{ vars.QUANT_BASE_URL }}
      - name: Test the Pages proxy
        run: node --test scripts/pages-proxy.test.mjs
      - name: Ensure the Pages project exists
        run: |
          npx cf pages get "quant-practice-$QUANT_PAGES_SUFFIX" >/dev/null 2>&1 || \
          npx cf pages create --name "quant-practice-$QUANT_PAGES_SUFFIX" --production-branch main
        env:
          QUANT_PAGES_SUFFIX: ${{ inputs.environment == 'production' && '' || '-staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Pages front end
        run: npx cf pages deployments create "quant-practice-$QUANT_PAGES_SUFFIX" --pages-build-output-dir ".cloudflare/pages/$QUANT_MODE" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_REF_NAME $GITHUB_SHA"
        env:
          QUANT_PAGES_SUFFIX: ${{ inputs.environment == 'production' && '' || '-staging' }}
          QUANT_MODE: ${{ inputs.environment || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the deployed Pages application
        run: node scripts/smoke-pages.mjs
        env:
          QUANT_PAGES_URL: https://quant-practice${{ inputs.environment == 'production' && '' || '-staging' }}.pages.dev
          QUANT_EXPECTED_REVISION: ${{ github.sha }}
